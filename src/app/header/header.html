<header class="header" [class.scrolled]="isScrolled">
  <div class="header-container">
    <div class="logo">
      <a routerLink="/">
        <img src="images/logoplasticos.png" alt="Plásticos San Mateo" class="logo-image" />
      </a>
    </div>

    <nav class="nav-menu" [class.active]="menuOpen">
      <ul class="nav-list">
        <li><a routerLink="/" (click)="closeMenu()" [class.active]="isActive('/')">Inicio</a></li>
        <li><a routerLink="/productos" (click)="closeMenu()" [class.active]="isActive('/productos')">Productos</a></li>
        <li><a routerLink="/servicios" (click)="closeMenu()" [class.active]="isActive('/servicios')">Servicios</a></li>
        <li><a routerLink="/nosotros" (click)="closeMenu()" [class.active]="isActive('/nosotros')">Nosotros</a></li>
        <li><a routerLink="/contacto" (click)="closeMenu()" [class.active]="isActive('/contacto')">Contacto</a></li>
      </ul>
    </nav>

    <div class="header-actions">
      <a routerLink="/contacto" class="btn-cotizar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v20M2 12h20"/>
        </svg>
        Cotizar
      </a>
      <button class="menu-toggle" (click)="toggleMenu()" aria-label="Menú">
        <span class="hamburger-line" [class.open]="menuOpen"></span>
        <span class="hamburger-line" [class.open]="menuOpen"></span>
      </button>
    </div>
  </div>
</header>
